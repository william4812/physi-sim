name: physi-sim CI

on:
  push:
    branches: [ "**" ]        # run on every branch
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        # One name drives configure + build + test (same name in all three
        # preset namespaces).
        #   hpc-release = optimized + hardened (also what CD ships)
        #   hpc-debug   = -O0 -g, bounds-checked: gfortran -fcheck=all on the
        #                 kernels + libstdc++ _GLIBCXX_ASSERTIONS on C++ access,
        #                 so an out-of-bounds index in the residual path is caught.
        preset: [ hpc-release, hpc-debug ]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Install Dependencies
        # gfortran is explicit: the project is LANGUAGES CXX Fortran, so CMake
        # needs a Fortran compiler at configure time, and the presets set
        # CMAKE_Fortran_FLAGS. Don't rely on the runner image shipping it.
        run: |
          sudo apt-get update
          sudo apt-get install -y cmake g++ gfortran libgtest-dev

      - name: Configure
        run: cmake --preset ${{ matrix.preset }}

      - name: Build
        # binaryDir comes from the preset (build/ or build-debug/). -j$(nproc)
        # because a bare `cmake --build` is serial with the Makefiles generator.
        run: cmake --build --preset ${{ matrix.preset }} -j$(nproc)

      - name: Test
        # ctest reads the build dir from the preset; output-on-failure is baked
        # into the test preset, so no -C / --output-on-failure flags needed.
        run: ctest --preset ${{ matrix.preset }}
